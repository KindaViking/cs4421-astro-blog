name: Deploy Container

# Called by ci.yml once every check has passed on main.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/astro-blog:${{ env.IMAGE_TAG }}
        run: |
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - name: Install CDK Dependencies
        working-directory: cdk
        run: npm ci

      - name: Deploy to ECS Fargate with AWS CDK
        working-directory: cdk
        run: npx cdk deploy AstroAppStack -c imageTag="$IMAGE_TAG" --require-approval never
