name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npx astro check
      - run: npm test
      - run: npm run build

      - name: Build static site
        env:
          BUILD_TARGET: static
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t astro-blog:ci .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: astro-blog:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Start the container
        run: docker run -d --name app -p 4321:4321 astro-blog:ci

      - name: Wait until /api/health returns 200
        run: |
          for i in $(seq 1 30); do
            curl -fs http://localhost:4321/api/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1

      - name: Smoke test pages and logs
        run: |
          curl -fs -o /dev/null http://localhost:4321/
          curl -fs -o /dev/null http://localhost:4321/blog
          docker logs app 2>&1 | grep statusCode | tail -1 | jq -e '.statusCode == 200'

      - name: Load test the container
        run: |
          docker run --rm --network host -v "$PWD/load:/load" \
            grafana/k6:2.3.0 run /load/k6.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps

      - name: Run Playwright tests against the container
        env:
          REUSE_SERVER: true
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc
      - run: npm test

  # Each deploy runs only on main, and only once every check above has passed.
  deploy-container:
    needs: [build, docker, infra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-container.yml
    secrets: inherit

  deploy-static:
    needs: [build, docker, infra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-static.yml
    secrets: inherit
