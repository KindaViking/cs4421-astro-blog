name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npx astro check
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t astro-blog:ci .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: astro-blog:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Start the container
        run: docker run -d --name app -p 4321:4321 astro-blog:ci

      - name: Wait until /api/health returns 200
        run: |
          for i in $(seq 1 30); do
            curl -fs http://localhost:4321/api/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1

      - name: Smoke test pages and logs
        run: |
          curl -fs -o /dev/null http://localhost:4321/
          curl -fs -o /dev/null http://localhost:4321/blog
          docker logs app 2>&1 | grep statusCode | tail -1 | jq -e '.statusCode == 200'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps

      - name: Run Playwright tests against the container
        env:
          REUSE_SERVER: true
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc
      - run: npm test

  deploy:
    needs: [build, docker, infra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/astro-blog:${{ env.IMAGE_TAG }}
        run: |
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - name: Install CDK Dependencies
        working-directory: cdk
        run: npm ci

      - name: Deploy to ECS Fargate with AWS CDK
        working-directory: cdk
        run: npx cdk deploy AstroAppStack -c imageTag="$IMAGE_TAG" --require-approval never
