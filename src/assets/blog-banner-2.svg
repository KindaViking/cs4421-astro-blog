<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
<rect width="1200" height="600" fill="#0a0f0a"/>
<rect x="20" y="20" width="1160" height="560" fill="none" stroke="#1a2e1a" stroke-width="2"/>
<text x="60" y="100" font-family="monospace" font-size="22" fill="#88cc88">$ git checkout -b feature/update</text>
<text x="60" y="150" font-family="monospace" font-size="18" fill="#33ff33">Switched to a new branch 'feature/update'</text>
<text x="60" y="220" font-family="monospace" font-size="22" fill="#88cc88">$ git add .</text>
<text x="60" y="270" font-family="monospace" font-size="22" fill="#88cc88">$ git commit -m "progress"</text>
<text x="60" y="320" font-family="monospace" font-size="18" fill="#33ff33">[feature/update a1b2c3d] progress</text>
<text x="60" y="370" font-family="monospace" font-size="18" fill="#33ff33"> 3 files changed, 42 insertions(+)</text>
<text x="60" y="440" font-family="monospace" font-size="22" fill="#88cc88">$ git push origin feature/update</text>
<text x="60" y="490" font-family="monospace" font-size="18" fill="#ff9900">Opening pull request...</text>
</svg>
